name: Sync Drive media

on:
  workflow_dispatch:
  push:
    paths:
      - "clips.json"

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq python3-pip
          pip3 install --quiet gdown

      - name: Pull public Drive clips, normalize, preview
        run: |
          set -e
          outdir="hostel-normal-2026-07"
          mkdir -p "$outdir"
          count=$(jq length clips.json)
          for i in $(seq 0 $((count - 1))); do
            id=$(jq -r ".[$i].id" clips.json)
            base=$(jq -r ".[$i].name" clips.json)
            out="$outdir/$base.mp4"
            pdir="$outdir/_previews/$base"
            if [ -f "$out" ]; then echo "skip existing $out"; continue; fi
            echo "=== $base ($id) ==="
            rm -f in.bin
            gdown "$id" -O in.bin --no-cookies || { echo "download failed: $base"; continue; }
            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 in.bin >/tmp/codec 2>/dev/null; then
              echo "not a video / bad download: $base"; continue
            fi
            codec=$(cat /tmp/codec)
            echo "codec=$codec"
            case "$codec" in
              h264|avc1)
                ffmpeg -nostdin -y -i in.bin -c copy -movflags +faststart "$out" || \
                ffmpeg -nostdin -y -i in.bin -c:v libx264 -crf 17 -preset slow -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart "$out"
                ;;
              *)
                ffmpeg -nostdin -y -i in.bin -c:v libx264 -crf 17 -preset slow -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart "$out"
                ;;
            esac
            mkdir -p "$pdir"
            ffmpeg -nostdin -y -i "$out" -vf "fps=1/2,scale=360:-1" -frames:v 8 "$pdir/frame-%02d.jpg" || echo "frames failed: $base"
          done

      - name: Commit and push new media
        run: |
          git config user.name "BeeBigger Bot"
          git config user.email "info@beebigger.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new media to commit."
          else
            git commit -m "sync: hostel normal reels $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
