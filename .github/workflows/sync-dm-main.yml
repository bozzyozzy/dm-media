name: Sync DM main media

on:
  workflow_dispatch:
  push:
    paths:
      - "dm-main-clips.json"

permissions:
  contents: write

concurrency:
  group: sync-dm-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq rclone python3-pip
          pip3 install --quiet gdown

      - name: Write service account key
        run: printf '%s' "$GDRIVE_SA_KEY" > "$RUNNER_TEMP/sa.json"
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}

      - name: Pull clips from Drive
        env:
          DM_FOLDER_ID: 1NLZCrz7z8WCjLQsGvp-FzixPieOCXK_H
        run: |
          inc="$RUNNER_TEMP/incoming"
          mkdir -p "$inc"
          # Preferred: service account, no link-sharing needed.
          rclone copy \
            --drive-service-account-file "$RUNNER_TEMP/sa.json" \
            --drive-root-folder-id "$DM_FOLDER_ID" \
            --drive-acknowledge-abuse \
            --exclude "*(posted)*/**" \
            --max-depth 1 \
            ":drive:" "$inc" || echo "::warning::rclone pull failed, will fall back to gdown per file"
          ls -la "$inc" || true

      - name: Normalize to MP4 (quality first)
        run: |
          inc="$RUNNER_TEMP/incoming"
          count=$(jq length dm-main-clips.json)
          fail=0
          for i in $(seq 0 $((count - 1))); do
            id=$(jq -r ".[$i].id" dm-main-clips.json)
            src=$(jq -r ".[$i].src" dm-main-clips.json)
            base=$(jq -r ".[$i].name" dm-main-clips.json)
            out="./$base.mp4"
            if [ -f "$out" ]; then echo "skip existing $out"; continue; fi
            echo "::group::$base"

            f="$inc/$src"
            if [ ! -f "$f" ]; then
              echo "not in rclone pull, trying gdown for $id"
              rm -f "$RUNNER_TEMP/in.bin"
              gdown "$id" -O "$RUNNER_TEMP/in.bin" --no-cookies || { echo "::warning::download failed: $base"; fail=1; echo "::endgroup::"; continue; }
              f="$RUNNER_TEMP/in.bin"
            fi

            codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" 2>/dev/null || true)
            if [ -z "$codec" ]; then echo "::warning::not a video: $base"; fail=1; echo "::endgroup::"; continue; fi
            echo "source codec=$codec"

            # H.264 already: rewrap losslessly, zero quality change.
            if [ "$codec" = "h264" ] || [ "$codec" = "avc1" ]; then
              if ffmpeg -nostdin -y -i "$f" -c copy -map_metadata 0 -movflags +faststart "$out" 2>/dev/null; then
                echo "lossless rewrap"
                echo "::endgroup::"; continue
              fi
              echo "rewrap failed, falling through to encode"
            fi

            # Anything else (HEVC from iPhone): encode at near-visually-lossless.
            # No -maxrate cap: bitrate is whatever crf 17 needs.
            encode () {
              ffmpeg -nostdin -y -i "$f" \
                -c:v libx264 -crf "$1" -preset slow \
                -pix_fmt yuv420p -profile:v high -level 4.2 \
                -c:a aac -b:a 192k \
                -map_metadata 0 -movflags +faststart -tag:v avc1 "$out"
            }
            encode 17 || { echo "::warning::encode failed: $base"; fail=1; echo "::endgroup::"; continue; }

            # GitHub hard-rejects blobs over 100MB. Step down only if we must.
            for q in 19 21; do
              sz=$(stat -c%s "$out")
              [ "$sz" -le 95000000 ] && break
              echo "::warning::$base is $sz bytes, re-encoding at crf $q"
              encode "$q" || break
            done

            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,bit_rate -of csv=p=0 "$out"
            echo "::endgroup::"
          done
          rm -f "$RUNNER_TEMP/in.bin"
          [ "$fail" = "0" ] || echo "::warning::one or more clips did not convert, see warnings above"

      - name: Commit and push
        run: |
          git config user.name "BeeBigger Bot"
          git config user.email "info@beebigger.com"
          jq -r '.[].name' dm-main-clips.json | while read -r n; do [ -f "$n.mp4" ] && git add -- "$n.mp4"; done
          if git diff --staged --quiet; then
            echo "No new media to commit."
          else
            git commit -m "sync: dm-main reels $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
